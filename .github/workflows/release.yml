# DISABLED: legacy changesets/npm release for the original Tauri app (now under
# tauri/). The native Swift rewrite doesn't use it, and package.json no longer
# lives at the repo root, so this must not run automatically. Kept for reference
# and manual dispatch only. A native-app release pipeline (Developer ID signing
# + notarization) is a separate future task.
name: Release (legacy Tauri — disabled)

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: "chore: update versions and changelog"
          title: "chore: update versions and changelog"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
