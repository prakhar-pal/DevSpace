name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build-test:
    name: Build & test (Linux GTK/VTE)
    if: >-
      github.head_ref != 'release/main' &&
      !contains(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-26.04
    container: swift:6.4.1-resolute
    timeout-minutes: 30
    env:
      GDK_BACKEND: x11
      GTK_A11Y: none
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK/VTE and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential dpkg-dev pkg-config libgtk-4-dev \
            libvte-2.91-gtk4-dev xvfb xauth dbus python3 openssh-client util-linux zsh

      - name: Show toolchain and native libraries
        run: |
          swift --version
          pkg-config --modversion gtk4 vte-2.91-gtk4

      - name: Test portable Core
        run: make linux-test-core

      - name: Test Swift protocol client
        run: make linux-test-protocol

      - name: Test Linux integration and package assembly
        run: make linux-test

      - name: Assemble development bundle
        run: make linux-bundle-dev

  build-test:
    name: Build & test (SwiftPM)
    # Skip for the automated release flow (.github/workflows/release.yml):
    # release/main PRs and their merges only touch Info.plist + CHANGELOG.md,
    # never Swift source, so a macOS build/test run is wasted. Matches the PR
    # source branch (pull_request) or the merge commit message (push to main —
    # covers both squash merges, where the message IS the PR title, and merge
    # commits, where the PR title is in the body).
    if: >-
      github.head_ref != 'release/main' &&
      !contains(github.event.head_commit.message, 'chore: release v')
    # macos-15 ships Xcode 16 / Swift 6, required by libghostty-spm
    # (swift-tools-version 6.0). macos-14 defaults to Swift 5.9 and can't even
    # resolve the dependency.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      # Cache the resolved SwiftPM deps + the prebuilt libghostty xcframework
      # so only the first run pays the download.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: make test

      - name: Build dev app
        run: make build-dev

      - name: Build release executable
        run: swift build -c release --product DevSpaceApp
